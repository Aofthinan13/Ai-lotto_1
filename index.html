<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Turbo Lotto AI</title>

<!-- FONT -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap"
rel="stylesheet">

<!-- MANIFEST -->

<link rel="manifest"
href="manifest.json">

<!-- TAILWIND -->

<script src="https://cdn.tailwindcss.com"></script>

<!-- TFJS -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<style>

body{

font-family:'Kanit',sans-serif;
background:#020617;
color:white;

}

.glass{

background:rgba(255,255,255,.05);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.08);

}

.ball{

width:70px;
height:70px;

border-radius:999px;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
font-weight:bold;

color:white;

animation:pop .4s ease;

}

@keyframes pop{

0%{

transform:scale(.5);
opacity:0;

}

100%{

transform:scale(1);
opacity:1;

}

}

.loading{

animation:pulse 1s infinite;

}

button:disabled{

opacity:.5;
cursor:not-allowed;

}

</style>

</head>

<body class="min-h-screen p-4">

<div class="max-w-md mx-auto">

<div class="glass rounded-3xl p-5 shadow-2xl">

<h1 class="text-4xl font-bold text-center mb-2">

🎯 Turbo Lotto AI

</h1>

<p class="text-center text-cyan-400 mb-6">

Realtime Firebase Edition

</p>

<!-- BUTTON -->

<div class="flex gap-3 mb-6">

<button
id="thaiBtn"
class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold">

🇹🇭 หวยไทย

</button>

<button
id="laoBtn"
class="flex-1 bg-slate-800 py-3 rounded-xl font-bold">

🇱🇦 หวยลาว

</button>

</div>

<!-- GENERATE -->

<button
id="generateBtn"
class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 py-4 rounded-2xl font-bold text-lg shadow-lg mb-6">

🚀 วิเคราะห์ด้วย AI

</button>

<!-- AI STATUS -->

<div class="glass rounded-2xl p-4 mb-6">

<div class="flex justify-between items-center">

<span class="font-bold">

AI STATUS

</span>

<span
id="aiStatus"
class="text-yellow-400">

Loading...

</span>

</div>

</div>

<!-- RESULT -->

<div class="space-y-5">

<div>

<h2 class="font-bold mb-3">

รางวัลหลัก

</h2>

<div
id="mainContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3">

3 ตัวท้าย

</h2>

<div
id="threeContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3">

2 ตัวท้าย

</h2>

<div
id="twoContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3 text-yellow-400">

2 ตัวล่าง

</h2>

<div
id="bottomContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

</div>

<!-- HOT -->

<div class="mt-8">

<h2 class="font-bold mb-3">

🔥 Hot Digits

</h2>

<div
id="hotDigits"
class="grid grid-cols-5 gap-2">

</div>

</div>

<!-- HISTORY -->

<div class="mt-8">

<h2 class="font-bold mb-3">

📊 Realtime History

</h2>

<div
id="historyContainer"
class="space-y-3">

</div>

</div>

</div>

</div>

<script type="module">

/* =========================
 FIREBASE
========================= */

import {

initializeApp

}
from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {

getDatabase,
ref,
set,
onValue

}
from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

/* =========================
 CONFIG
========================= */

const firebaseConfig={

apiKey:"PUT_API_KEY",

authDomain:"PUT_AUTH_DOMAIN",

databaseURL:"PUT_DATABASE_URL",

projectId:"PUT_PROJECT_ID",

storageBucket:"PUT_STORAGE_BUCKET",

messagingSenderId:"PUT_SENDER_ID",

appId:"PUT_APP_ID"

};

/* =========================
 INIT
========================= */

const app=
initializeApp(firebaseConfig);

const db=
getDatabase(app);

/* =========================
 GLOBAL
========================= */

let currentMode='thai';

let isGenerating=false;

let aiModel=null;

/* =========================
 ELEMENTS
========================= */

const thaiBtn=
document.getElementById('thaiBtn');

const laoBtn=
document.getElementById('laoBtn');

const generateBtn=
document.getElementById('generateBtn');

const mainContainer=
document.getElementById('mainContainer');

const threeContainer=
document.getElementById('threeContainer');

const twoContainer=
document.getElementById('twoContainer');

const bottomContainer=
document.getElementById('bottomContainer');

const historyContainer=
document.getElementById('historyContainer');

const hotDigits=
document.getElementById('hotDigits');

const aiStatus=
document.getElementById('aiStatus');

/* =========================
 DATABASE
========================= */

let historyData={

thai:[],

lao:[
{
date:'20 พ.ค. 69',
main:'8769'
},
{
date:'18 พ.ค. 69',
main:'9572'
},
{
date:'15 พ.ค. 69',
main:'3417'
},
{
date:'13 พ.ค. 69',
main:'7804'
},
{
date:'11 พ.ค. 69',
main:'1932'
}
]

};

/* =========================
 FIREBASE LOAD
========================= */

function listenRealtime(){

onValue(

ref(db,'lotto'),

(snapshot)=>{

const data=
snapshot.val();

if(data){

historyData=data;

renderHistory();

renderHotDigits();

}

}

);

}

/* =========================
 FETCH THAI
========================= */

async function fetchThai(){

try{

const response=
await fetch(
'https://lotto.api.rayriffy.com/latest'
);

const json=
await response.json();

const firstPrize=
json.response.prizes.find(
p=>p.id==='first'
);

const lastTwo=
json.response.runningNumbers.find(
n=>n.id==='lastTwo'
);

const result={

date:json.response.date,

main:firstPrize.number,

bottom:lastTwo.number

};

const exists=
historyData.thai.some(
x=>x.date===result.date
);

if(!exists){

historyData.thai.unshift(result);

await saveRealtime();

}

}catch(error){

console.log(error);

}

}

/* =========================
 SAVE FIREBASE
========================= */

async function saveRealtime(){

await set(

ref(db,'lotto'),

historyData

);

renderHistory();

renderHotDigits();

}

/* =========================
 HISTORY
========================= */

function renderHistory(){

historyContainer.innerHTML='';

historyData[currentMode]
.forEach(item=>{

const div=
document.createElement('div');

div.className=
'glass rounded-2xl p-4';

if(currentMode==='thai'){

div.innerHTML=`

<div class="flex justify-between mb-2">

<span class="text-emerald-400 text-xs">

${item.date}

</span>

<span class="text-yellow-400 text-xs">

ล่าง ${item.bottom}

</span>

</div>

<div class="text-2xl font-bold">

${item.main}

</div>

`;

}else{

const top=
item.main.slice(-2);

const bottom=
item.main.slice(0,2);

div.innerHTML=`

<div class="flex justify-between mb-2">

<span class="text-red-400 text-xs">

${item.date}

</span>

</div>

<div class="text-2xl font-bold">

${item.main}

</div>

<div class="text-xs text-slate-400 mt-2">

บน ${top} | ล่าง ${bottom}

</div>

`;

}

historyContainer.appendChild(div);

});

}

/* =========================
 HOT DIGITS
========================= */

function renderHotDigits(){

hotDigits.innerHTML='';

const freq={};

for(let i=0;i<=9;i++){

freq[i]=0;

}

historyData[currentMode]
.forEach((item,index)=>{

const weight=
historyData[currentMode].length-index;

item.main
.split('')
.forEach(n=>{

freq[n]+=weight;

});

});

const sorted=
Object.entries(freq)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

sorted.forEach(item=>{

const div=
document.createElement('div');

div.className=
'glass rounded-xl p-3 text-center';

div.innerHTML=`

<div class="text-2xl font-bold text-orange-400">

${item[0]}

</div>

<div class="text-xs text-slate-400">

score ${item[1]}

</div>

`;

hotDigits.appendChild(div);

});

}

/* =========================
 AI MODEL
========================= */

async function createModel(){

const size=
currentMode==='thai'
?6
:4;

aiModel=tf.sequential();

aiModel.add(

tf.layers.dense({

units:64,

activation:'relu',

inputShape:[size]

})

);

aiModel.add(

tf.layers.dense({

units:32,

activation:'relu'

})

);

aiModel.add(

tf.layers.dense({

units:size,

activation:'sigmoid'

})

);

aiModel.compile({

optimizer:'adam',

loss:'meanSquaredError'

});

}

/* =========================
 TRAIN
========================= */

async function trainAI(){

const dataset=
historyData[currentMode]
.map(item=>

item.main
.split('')
.map(n=>Number(n)/9)

);

if(dataset.length<3){

aiStatus.innerText=
'ข้อมูลน้อยเกินไป';

return;

}

const xs=[];
const ys=[];

for(
let i=0;
i<dataset.length-1;
i++
){

xs.push(dataset[i]);

ys.push(dataset[i+1]);

}

await createModel();

await aiModel.fit(

tf.tensor2d(xs),

tf.tensor2d(ys),

{

epochs:30,

shuffle:true

}

);

aiStatus.innerText=
'AI READY';

}

/* =========================
 PREDICT
========================= */

async function predictAI(){

if(isGenerating){

return;

}

isGenerating=true;

generateBtn.disabled=true;

generateBtn.innerText=
'กำลังวิเคราะห์...';

const latest=
historyData[currentMode][0]
.main
.split('')
.map(n=>Number(n)/9);

const input=
tf.tensor2d([latest]);

const prediction=
aiModel.predict(input);

const values=
await prediction.data();

let result='';

values.forEach(v=>{

result+=
Math.abs(
Math.round(v*9)
)%10;

});

const three=
result.slice(-3);

const two=
result.slice(-2);

let bottom='';

if(currentMode==='thai'){

bottom=
Math.floor(Math.random()*10)
+
''
+
Math.floor(Math.random()*10);

}else{

bottom=
result.slice(0,2);

}

renderBalls(
mainContainer,
result,
'bg-gradient-to-br from-emerald-500 to-teal-700'
);

renderBalls(
threeContainer,
three,
'bg-gradient-to-br from-violet-500 to-indigo-700'
);

renderBalls(
twoContainer,
two,
'bg-gradient-to-br from-cyan-500 to-blue-700'
);

renderBalls(
bottomContainer,
bottom,
'bg-gradient-to-br from-yellow-500 to-orange-600'
);

generateBtn.disabled=false;

generateBtn.innerText=
'🚀 วิเคราะห์ด้วย AI';

isGenerating=false;

}

/* =========================
 BALLS
========================= */

function renderBalls(
container,
number,
color
){

container.innerHTML='';

number.split('')
.forEach(n=>{

const div=
document.createElement('div');

div.className=
`ball ${color}`;

div.innerText=n;

container.appendChild(div);

});

}

/* =========================
 MODE
========================= */

thaiBtn.onclick=async()=>{

currentMode='thai';

thaiBtn.className=
'flex-1 bg-emerald-600 py-3 rounded-xl font-bold';

laoBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

renderHistory();

renderHotDigits();

await trainAI();

};

laoBtn.onclick=async()=>{

currentMode='lao';

laoBtn.className=
'flex-1 bg-red-600 py-3 rounded-xl font-bold';

thaiBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

renderHistory();

renderHotDigits();

await trainAI();

};

/* =========================
 BUTTON
========================= */

generateBtn.onclick=
predictAI;

/* =========================
 AUTO UPDATE
========================= */

setInterval(()=>{

fetchThai();

},300000);

/* =========================
 SERVICE WORKER
========================= */

if('serviceWorker' in navigator){

navigator.serviceWorker.register('./sw.js');

}

/* =========================
 START
========================= */

window.onload=async()=>{

listenRealtime();

await fetchThai();

renderHistory();

renderHotDigits();

await trainAI();

};

</script>

</body>

</html>
