<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Turbo Lotto AI PRO</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{

font-family:'Kanit',sans-serif;
background:#020617;
color:white;

}

.glass{

background:rgba(255,255,255,.05);

backdrop-filter:blur(6px);

border:1px solid rgba(255,255,255,.08);

}

.ball{

width:68px;
height:68px;

border-radius:999px;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
font-weight:bold;

color:white;

transition:.3s;

animation:pop .35s ease;

box-shadow:
0 10px 20px rgba(0,0,0,.35);

}

@keyframes pop{

0%{

transform:scale(.5);
opacity:0;

}

100%{

transform:scale(1);
opacity:1;

}

}

button{

transition:.2s;

}

button:active{

transform:scale(.96);

}

.loading{

animation:pulse 1s infinite;

}

.fadeIn{

animation:fade .4s ease;

}

@keyframes fade{

0%{

opacity:0;
transform:translateY(10px);

}

100%{

opacity:1;
transform:translateY(0);

}

}

</style>

</head>

<body class="min-h-screen p-4">

<div class="max-w-md mx-auto">

<div class="glass rounded-3xl p-5 shadow-2xl fadeIn">

<h1 class="text-4xl font-bold text-center mb-2">

🎯 Turbo Lotto AI PRO

</h1>

<p class="text-center text-cyan-400 mb-6">

Advanced Prediction System

</p>

<!-- MODE -->

<div class="flex gap-3 mb-6">

<button
id="thaiBtn"
class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold">

🇹🇭 หวยไทย

</button>

<button
id="laoBtn"
class="flex-1 bg-slate-800 py-3 rounded-xl font-bold">

🇱🇦 หวยลาว

</button>

</div>

<!-- GENERATE -->

<button
id="generateBtn"
class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 py-4 rounded-2xl font-bold text-lg shadow-lg mb-6">

🚀 วิเคราะห์เลข AI

</button>

<!-- RESULT -->

<div class="space-y-5">

<div>

<h2 class="font-bold mb-3">

รางวัลหลัก

</h2>

<div
id="mainContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3">

3 ตัวท้าย

</h2>

<div
id="threeContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3">

2 ตัวท้าย

</h2>

<div
id="twoContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3 text-yellow-400">

2 ตัวล่าง

</h2>

<div
id="bottomContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

</div>

<!-- HOT DIGITS -->

<div class="mt-8">

<h2 class="font-bold mb-3">

🔥 Hot Digits

</h2>

<div
id="hotDigits"
class="grid grid-cols-5 gap-2">

</div>

</div>

<!-- CONFIDENCE -->

<div class="mt-8">

<h2 class="font-bold mb-3">

📈 AI Confidence

</h2>

<div
id="confidenceBox"
class="glass rounded-2xl p-5 text-center">

--

</div>

</div>

</div>

</div>

<script>

/* =========================
 GLOBAL
========================= */

let currentMode=
localStorage.getItem('mode')
||'thai';

/* =========================
 DATA
========================= */

const thaiNumbers=[

'985452',
'284729',
'543118',
'074205',
'998887',
'125272',
'361807'

];

const laoNumbers=[

'8769',
'0470',
'3369',
'7095',
'9996'

];

/* =========================
 ELEMENTS
========================= */

const thaiBtn=
document.getElementById('thaiBtn');

const laoBtn=
document.getElementById('laoBtn');

const generateBtn=
document.getElementById('generateBtn');

const mainContainer=
document.getElementById('mainContainer');

const threeContainer=
document.getElementById('threeContainer');

const twoContainer=
document.getElementById('twoContainer');

const bottomContainer=
document.getElementById('bottomContainer');

const hotDigits=
document.getElementById('hotDigits');

const confidenceBox=
document.getElementById('confidenceBox');

/* =========================
 HOT DIGITS
========================= */

function renderHotDigits(){

try{

hotDigits.innerHTML='';

const freq={};

for(let i=0;i<=9;i++){

freq[i]=0;

}

const source=
currentMode==='thai'
?thaiNumbers
:laoNumbers;

/* recent weight */

source.forEach((item,index)=>{

const weight=
source.length-index;

item
.split('')
.forEach(n=>{

freq[n]+=weight;

});

});

const sorted=
Object.entries(freq)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

sorted.forEach(item=>{

const div=
document.createElement('div');

div.className=
'glass rounded-xl p-3 text-center fadeIn';

div.innerHTML=`

<div class="text-2xl font-bold text-orange-400">

${item[0]}

</div>

<div class="text-xs text-slate-400">

${item[1]} hits

</div>

`;

hotDigits.appendChild(div);

});

}catch(error){

console.log(error);

}

}

/* =========================
 BALLS
========================= */

function renderBalls(
container,
number,
color
){

container.innerHTML='';

number.split('')
.forEach(n=>{

const div=
document.createElement('div');

div.className=
`ball ${color}`;

div.innerText=n;

container.appendChild(div);

});

}

/* =========================
 POSITIONAL AI
========================= */

function weightedRandom(position){

const freq={};

for(let i=0;i<=9;i++){

freq[i]=1;

}

const source=
currentMode==='thai'
?thaiNumbers
:laoNumbers;

/* position analysis */

source.forEach((item,index)=>{

const weight=
Math.floor(
(source.length-index)*0.7
);

const digit=
item[position];

if(digit!==undefined){

freq[digit]+=weight;

}

});

/* anti spam */

Object.keys(freq)
.forEach(key=>{

if(freq[key]>18){

freq[key]-=4;

}

});

/* pool */

const pool=[];

Object.entries(freq)
.forEach(([digit,score])=>{

for(let i=0;i<score;i++){

pool.push(digit);

}

});

return pool[
Math.floor(
Math.random()*pool.length
)

];

}

/* =========================
 CONFIDENCE
========================= */

function renderConfidence(number){

try{

let score=0;

const digits=
number.split('');

const unique=
new Set(digits);

score+=unique.size*10;

const source=
currentMode==='thai'
?thaiNumbers
:laoNumbers;

/* hot match */

digits.forEach(d=>{

source.forEach(n=>{

if(n.includes(d)){

score+=2;

}

});

});

/* odd even */

let odd=0;
let even=0;

digits.forEach(d=>{

if(Number(d)%2===0){

even++;

}else{

odd++;

}

});

if(
Math.abs(odd-even)<=2
){

score+=10;

}

/* no spam */

if(unique.size===digits.length){

score+=10;

}

/* limit */

if(score>99){

score=99;

}

confidenceBox.innerHTML=`

<div class="text-5xl font-bold text-emerald-400 fadeIn">

${score}%

</div>

<div class="text-slate-400 mt-2">

AI Probability Score

</div>

`;

}catch(error){

console.log(error);

}

}

/* =========================
 GENERATE
========================= */

function generateAI(){

try{

generateBtn.disabled=true;

generateBtn.innerHTML=
'⏳ กำลังวิเคราะห์...';

const length=
currentMode==='thai'
?6
:4;

let number='';

let attempts=0;

while(attempts<10){

number='';

for(let i=0;i<length;i++){

number+=weightedRandom(i);

}

const unique=
new Set(number);

if(unique.size>2){

break;

}

attempts++;

}

/* results */

const three=
number.slice(-3);

const two=
number.slice(-2);

let bottom='';

if(currentMode==='thai'){

bottom=
weightedRandom(4)
+
weightedRandom(5);

}else{

bottom=
number.slice(0,2);

}

/* loading */

setTimeout(()=>{

renderBalls(
mainContainer,
number,
'bg-gradient-to-br from-emerald-500 to-teal-700'
);

renderBalls(
threeContainer,
three,
'bg-gradient-to-br from-violet-500 to-indigo-700'
);

renderBalls(
twoContainer,
two,
'bg-gradient-to-br from-cyan-500 to-blue-700'
);

renderBalls(
bottomContainer,
bottom,
'bg-gradient-to-br from-yellow-500 to-orange-600'
);

renderConfidence(number);

generateBtn.disabled=false;

generateBtn.innerHTML=
'🚀 วิเคราะห์เลข AI';

},500);

}catch(error){

console.log(error);

generateBtn.disabled=false;

generateBtn.innerHTML=
'🚀 วิเคราะห์เลข AI';

}

}

/* =========================
 MODE
========================= */

function setMode(mode){

currentMode=mode;

localStorage.setItem(
'mode',
mode
);

if(mode==='thai'){

thaiBtn.className=
'flex-1 bg-emerald-600 py-3 rounded-xl font-bold';

laoBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

}else{

laoBtn.className=
'flex-1 bg-red-600 py-3 rounded-xl font-bold';

thaiBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

}

renderHotDigits();

}

/* =========================
 BUTTONS
========================= */

thaiBtn.onclick=()=>{

setMode('thai');

};

laoBtn.onclick=()=>{

setMode('lao');

};

generateBtn.onclick=
generateAI;

/* =========================
 START
========================= */

setMode(currentMode);

renderHotDigits();

</script>

</body>
</html>
