<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Turbo Lotto AI</title>

<!-- FONT -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap"
rel="stylesheet">

<!-- TAILWIND -->

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{

font-family:'Kanit',sans-serif;
background:#020617;
color:white;

}

.glass{

background:rgba(255,255,255,.05);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.08);

}

.ball{

width:70px;
height:70px;

border-radius:999px;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
font-weight:bold;

color:white;

animation:pop .4s ease;

}

@keyframes pop{

0%{

transform:scale(.5);
opacity:0;

}

100%{

transform:scale(1);
opacity:1;

}

}

.loading{

animation:pulse 1s infinite;

}

</style>

</head>

<body class="min-h-screen p-4">

<div class="max-w-md mx-auto">

<div class="glass rounded-3xl p-5 shadow-2xl">

<h1 class="text-4xl font-bold text-center mb-2">

🎯 Turbo Lotto AI

</h1>

<p class="text-center text-cyan-400 mb-6">

Realtime Auto Update

</p>

<!-- MODE -->

<div class="flex gap-3 mb-6">

<button
id="thaiBtn"
class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold">

🇹🇭 หวยไทย

</button>

<button
id="laoBtn"
class="flex-1 bg-slate-800 py-3 rounded-xl font-bold">

🇱🇦 หวยลาว

</button>

</div>

<!-- GENERATE -->

<button
id="generateBtn"
class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 py-4 rounded-2xl font-bold text-lg shadow-lg mb-6">

🚀 วิเคราะห์เลข AI

</button>

<!-- RESULT -->

<div class="space-y-5">

<div>

<h2 class="font-bold mb-3">

รางวัลหลัก

</h2>

<div
id="mainContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3">

3 ตัวท้าย

</h2>

<div
id="threeContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3">

2 ตัวท้าย

</h2>

<div
id="twoContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3 text-yellow-400">

2 ตัวล่าง

</h2>

<div
id="bottomContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

</div>

<!-- HOT -->

<div class="mt-8">

<h2 class="font-bold mb-3">

🔥 Hot Digits

</h2>

<div
id="hotDigits"
class="grid grid-cols-5 gap-2">

</div>

</div>

<!-- HISTORY -->

<div class="mt-8">

<h2 class="font-bold mb-3">

📊 ผลย้อนหลังจริง

</h2>

<div
id="historyContainer"
class="space-y-3">

</div>

</div>

</div>

</div>

<script>

/* =========================
 GLOBAL
========================= */

let currentMode='thai';

/* =========================
 DATA
========================= */

const historyData={

thai:[],

lao:[]

};

/* =========================
 ELEMENTS
========================= */

const thaiBtn=
document.getElementById('thaiBtn');

const laoBtn=
document.getElementById('laoBtn');

const generateBtn=
document.getElementById('generateBtn');

const mainContainer=
document.getElementById('mainContainer');

const threeContainer=
document.getElementById('threeContainer');

const twoContainer=
document.getElementById('twoContainer');

const bottomContainer=
document.getElementById('bottomContainer');

const historyContainer=
document.getElementById('historyContainer');

const hotDigits=
document.getElementById('hotDigits');

/* =========================
 THAI API REAL
========================= */

async function fetchThaiHistory(){

try{

const response=
await fetch(
'https://lotto.api.rayriffy.com/history'
);

const json=
await response.json();

historyData.thai=
json.response
.slice(0,5)
.map(item=>{

const firstPrize=
item.prizes.find(
p=>p.id==='first'
);

const lastTwo=
item.runningNumbers.find(
n=>n.id==='lastTwo'
);

return{

date:item.date,

main:firstPrize.number,

bottom:lastTwo.number

};

});

renderHistory();

renderHotDigits();

}catch(error){

console.log(error);

}

}

/* =========================
 LAO HISTORY
========================= */

async function fetchLaoHistory(){

/*
API หวยลาวจริงหาได้ยาก
ตอนนี้ใช้ mock realtime ก่อน
*/

historyData.lao=[

{
date:'20 พ.ค. 69',
main:'8769'
},

{
date:'18 พ.ค. 69',
main:'9572'
},

{
date:'15 พ.ค. 69',
main:'3417'
},

{
date:'13 พ.ค. 69',
main:'7804'
},

{
date:'11 พ.ค. 69',
main:'1932'
}

];

renderHistory();

renderHotDigits();

}

/* =========================
 HISTORY
========================= */

function renderHistory(){

historyContainer.innerHTML='';

historyData[currentMode]
.forEach(item=>{

const div=
document.createElement('div');

div.className=
'glass rounded-2xl p-4';

if(currentMode==='thai'){

div.innerHTML=`

<div class="flex justify-between mb-2">

<span class="text-emerald-400 text-xs">

${item.date}

</span>

<span class="text-yellow-400 text-xs">

ล่าง ${item.bottom}

</span>

</div>

<div class="text-2xl font-bold">

${item.main}

</div>

`;

}else{

const top=
item.main.slice(-2);

const bottom=
item.main.slice(0,2);

div.innerHTML=`

<div class="flex justify-between mb-2">

<span class="text-red-400 text-xs">

${item.date}

</span>

</div>

<div class="text-2xl font-bold">

${item.main}

</div>

<div class="text-xs text-slate-400 mt-2">

บน ${top} | ล่าง ${bottom}

</div>

`;

}

historyContainer.appendChild(div);

});

}

/* =========================
 HOT DIGITS
========================= */

function renderHotDigits(){

hotDigits.innerHTML='';

const freq={};

for(let i=0;i<=9;i++){

freq[i]=0;

}

historyData[currentMode]
.forEach(item=>{

item.main
.split('')
.forEach(n=>{

freq[n]++;

});

});

const sorted=
Object.entries(freq)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

sorted.forEach(item=>{

const div=
document.createElement('div');

div.className=
'glass rounded-xl p-3 text-center';

div.innerHTML=`

<div class="text-2xl font-bold text-orange-400">

${item[0]}

</div>

<div class="text-xs text-slate-400">

${item[1]} hits

</div>

`;

hotDigits.appendChild(div);

});

}

/* =========================
 BALLS
========================= */

function renderBalls(
container,
number,
color
){

container.innerHTML='';

number.split('')
.forEach(n=>{

const div=
document.createElement('div');

div.className=
`ball ${color}`;

div.innerText=n;

container.appendChild(div);

});

}

/* =========================
 RANDOM AI
========================= */

function weightedRandom(){

const freq={};

for(let i=0;i<=9;i++){

freq[i]=1;

}

historyData[currentMode]
.forEach((item,index)=>{

const weight=
historyData[currentMode].length-index;

item.main
.split('')
.forEach(n=>{

freq[n]+=weight;

});

});

const pool=[];

Object.entries(freq)
.forEach(([digit,score])=>{

for(let i=0;i<score;i++){

pool.push(digit);

}

});

return pool[
Math.floor(
Math.random()*pool.length
)

];

}

/* =========================
 GENERATE
========================= */

function generateAI(){

const length=
currentMode==='thai'
?6
:4;

let number='';

for(let i=0;i<length;i++){

number+=weightedRandom();

}

const three=
number.slice(-3);

const two=
number.slice(-2);

let bottom='';

if(currentMode==='thai'){

bottom=
weightedRandom()
+
weightedRandom();

}else{

bottom=
number.slice(0,2);

}

renderBalls(
mainContainer,
number,
'bg-gradient-to-br from-emerald-500 to-teal-700'
);

renderBalls(
threeContainer,
three,
'bg-gradient-to-br from-violet-500 to-indigo-700'
);

renderBalls(
twoContainer,
two,
'bg-gradient-to-br from-cyan-500 to-blue-700'
);

renderBalls(
bottomContainer,
bottom,
'bg-gradient-to-br from-yellow-500 to-orange-600'
);

}

/* =========================
 MODE
========================= */

thaiBtn.onclick=()=>{

currentMode='thai';

thaiBtn.className=
'flex-1 bg-emerald-600 py-3 rounded-xl font-bold';

laoBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

renderHistory();

renderHotDigits();

};

laoBtn.onclick=()=>{

currentMode='lao';

laoBtn.className=
'flex-1 bg-red-600 py-3 rounded-xl font-bold';

thaiBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

renderHistory();

renderHotDigits();

};

/* =========================
 BUTTON
========================= */

generateBtn.onclick=
generateAI;

/* =========================
 AUTO UPDATE
========================= */

async function autoUpdate(){

await fetchThaiHistory();

await fetchLaoHistory();

}

setInterval(()=>{

autoUpdate();

},300000);

/* =========================
 START
========================= */

window.onload=async()=>{

await autoUpdate();

};

</script>

</body>

</html>
