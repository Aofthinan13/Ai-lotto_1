<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Turbo Lotto AI</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{

font-family:'Kanit',sans-serif;
background:#020617;
color:white;

}

.glass{

background:rgba(255,255,255,.05);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,.08);

}

.ball{

width:70px;
height:70px;

border-radius:999px;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
font-weight:bold;

color:white;

animation:pop .4s ease;

}

@keyframes pop{

0%{

transform:scale(.5);
opacity:0;

}

100%{

transform:scale(1);
opacity:1;

}

}

</style>

</head>

<body class="min-h-screen p-4">

<div class="max-w-md mx-auto">

<div class="glass rounded-3xl p-5 shadow-2xl">

<h1 class="text-4xl font-bold text-center mb-2">

🎯 Turbo Lotto AI

</h1>

<p class="text-center text-cyan-400 mb-6">

AI Prediction System

</p>

<!-- MODE -->

<div class="flex gap-3 mb-6">

<button
id="thaiBtn"
class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold transition">

🇹🇭 หวยไทย

</button>

<button
id="laoBtn"
class="flex-1 bg-slate-800 py-3 rounded-xl font-bold transition">

🇱🇦 หวยลาว

</button>

</div>

<!-- GENERATE -->

<button
id="generateBtn"
class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 py-4 rounded-2xl font-bold text-lg shadow-lg mb-6">

🚀 วิเคราะห์เลข AI

</button>

<!-- RESULT -->

<div class="space-y-5">

<div>

<h2 class="font-bold mb-3">

รางวัลหลัก

</h2>

<div
id="mainContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3">

3 ตัวท้าย

</h2>

<div
id="threeContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3">

2 ตัวท้าย

</h2>

<div
id="twoContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div>

<h2 class="font-bold mb-3 text-yellow-400">

2 ตัวล่าง

</h2>

<div
id="bottomContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

</div>

<!-- HOT DIGITS -->

<div class="mt-8">

<h2 class="font-bold mb-3">

🔥 Hot Digits

</h2>

<div
id="hotDigits"
class="grid grid-cols-5 gap-2">

</div>

</div>

</div>

</div>

<script>

/* =========================
 GLOBAL
========================= */

let currentMode='thai';

/* =========================
 DATA
========================= */

const thaiNumbers=[
'985452',
'284729',
'543118',
'074205',
'998887'
];

const laoNumbers=[
'8769',
'0470',
'3369',
'7095',
'9996'
];

/* =========================
 ELEMENTS
========================= */

const thaiBtn=
document.getElementById('thaiBtn');

const laoBtn=
document.getElementById('laoBtn');

const generateBtn=
document.getElementById('generateBtn');

const mainContainer=
document.getElementById('mainContainer');

const threeContainer=
document.getElementById('threeContainer');

const twoContainer=
document.getElementById('twoContainer');

const bottomContainer=
document.getElementById('bottomContainer');

const hotDigits=
document.getElementById('hotDigits');

/* =========================
 HOT DIGITS
========================= */

function renderHotDigits(){

hotDigits.innerHTML='';

const freq={};

for(let i=0;i<=9;i++){

freq[i]=0;

}

const source=
currentMode==='thai'
?thaiNumbers
:laoNumbers;

source.forEach(item=>{

item
.split('')
.forEach(n=>{

freq[n]++;

});

});

const sorted=
Object.entries(freq)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

sorted.forEach(item=>{

const div=
document.createElement('div');

div.className=
'glass rounded-xl p-3 text-center';

div.innerHTML=`

<div class="text-2xl font-bold text-orange-400">

${item[0]}

</div>

<div class="text-xs text-slate-400">

${item[1]} hits

</div>

`;

hotDigits.appendChild(div);

});

}

/* =========================
 BALLS
========================= */

function renderBalls(
container,
number,
color
){

container.innerHTML='';

number.split('')
.forEach(n=>{

const div=
document.createElement('div');

div.className=
`ball ${color}`;

div.innerText=n;

container.appendChild(div);

});

}

/* =========================
 AI RANDOM
========================= */

function weightedRandom(){

const freq={};

for(let i=0;i<=9;i++){

freq[i]=1;

}

const source=
currentMode==='thai'
?thaiNumbers
:laoNumbers;

source.forEach((item,index)=>{

const weight=
source.length-index;

item
.split('')
.forEach(n=>{

freq[n]+=weight;

});

});

const pool=[];

Object.entries(freq)
.forEach(([digit,score])=>{

for(let i=0;i<score;i++){

pool.push(digit);

}

});

return pool[
Math.floor(
Math.random()*pool.length
)

];

}

/* =========================
 GENERATE
========================= */

function generateAI(){

const length=
currentMode==='thai'
?6
:4;

let number='';

for(let i=0;i<length;i++){

number+=weightedRandom();

}

const three=
number.slice(-3);

const two=
number.slice(-2);

let bottom='';

if(currentMode==='thai'){

bottom=
weightedRandom()
+
weightedRandom();

}else{

bottom=
number.slice(0,2);

}

renderBalls(
mainContainer,
number,
'bg-gradient-to-br from-emerald-500 to-teal-700'
);

renderBalls(
threeContainer,
three,
'bg-gradient-to-br from-violet-500 to-indigo-700'
);

renderBalls(
twoContainer,
two,
'bg-gradient-to-br from-cyan-500 to-blue-700'
);

renderBalls(
bottomContainer,
bottom,
'bg-gradient-to-br from-yellow-500 to-orange-600'
);

}

/* =========================
 MODE
========================= */

thaiBtn.onclick=()=>{

currentMode='thai';

thaiBtn.className=
'flex-1 bg-emerald-600 py-3 rounded-xl font-bold transition';

laoBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold transition';

renderHotDigits();

};

laoBtn.onclick=()=>{

currentMode='lao';

laoBtn.className=
'flex-1 bg-red-600 py-3 rounded-xl font-bold transition';

thaiBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold transition';

renderHotDigits();

};

/* =========================
 BUTTON
========================= */

generateBtn.onclick=
generateAI;

/* =========================
 START
========================= */

renderHotDigits();

</script>

</body>

</html>
