<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Turbo Lotto AI</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<!-- FIREBASE COMPAT -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body{

font-family:'Kanit',sans-serif;
background:#020617;
color:white;

}

.ball{

width:70px;
height:70px;

border-radius:999px;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
font-weight:bold;

color:white;

}

.glass{

background:rgba(255,255,255,.05);

backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,.08);

}

</style>

</head>

<body class="min-h-screen p-4">

<div class="max-w-md mx-auto">

<div class="glass rounded-3xl p-5">

<h1 class="text-4xl font-bold text-center mb-2">

🎯 Turbo Lotto AI

</h1>

<p class="text-center text-cyan-400 mb-6">

Realtime Edition

</p>

<div class="flex gap-3 mb-6">

<button
id="thaiBtn"
class="flex-1 bg-emerald-600 py-3 rounded-xl font-bold">

🇹🇭 หวยไทย

</button>

<button
id="laoBtn"
class="flex-1 bg-slate-800 py-3 rounded-xl font-bold">

🇱🇦 หวยลาว

</button>

</div>

<button
id="generateBtn"
class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 py-4 rounded-2xl font-bold mb-6">

🚀 วิเคราะห์ AI

</button>

<div class="mb-6">

<div class="flex justify-between">

<span>

AI STATUS

</span>

<span
id="aiStatus"
class="text-yellow-400">

READY

</span>

</div>

</div>

<div class="mb-6">

<h2 class="font-bold mb-3">

รางวัลหลัก

</h2>

<div
id="mainContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div class="mb-6">

<h2 class="font-bold mb-3">

3 ตัวท้าย

</h2>

<div
id="threeContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div class="mb-6">

<h2 class="font-bold mb-3">

2 ตัวท้าย

</h2>

<div
id="twoContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div class="mb-6">

<h2 class="font-bold mb-3 text-yellow-400">

2 ตัวล่าง

</h2>

<div
id="bottomContainer"
class="flex justify-center gap-2 flex-wrap">

</div>

</div>

<div class="mb-6">

<h2 class="font-bold mb-3">

🔥 Hot Digits

</h2>

<div
id="hotDigits"
class="grid grid-cols-5 gap-2">

</div>

</div>

<div>

<h2 class="font-bold mb-3">

📊 History

</h2>

<div
id="historyContainer"
class="space-y-3">

</div>

</div>

</div>

</div>

<script>

/* ======================
 DATA
====================== */

let currentMode='thai';

const historyData={

thai:[

{
date:'16 พ.ค. 69',
main:'985452',
bottom:'95'
},

{
date:'2 พ.ค. 69',
main:'284729',
bottom:'38'
},

{
date:'16 เม.ย. 69',
main:'543118',
bottom:'21'
}

],

lao:[

{
date:'20 พ.ค. 69',
main:'8769'
},

{
date:'18 พ.ค. 69',
main:'9572'
},

{
date:'15 พ.ค. 69',
main:'3417'
}

]

};

/* ======================
 ELEMENTS
====================== */

const thaiBtn=
document.getElementById('thaiBtn');

const laoBtn=
document.getElementById('laoBtn');

const generateBtn=
document.getElementById('generateBtn');

const mainContainer=
document.getElementById('mainContainer');

const threeContainer=
document.getElementById('threeContainer');

const twoContainer=
document.getElementById('twoContainer');

const bottomContainer=
document.getElementById('bottomContainer');

const historyContainer=
document.getElementById('historyContainer');

const hotDigits=
document.getElementById('hotDigits');

/* ======================
 HISTORY
====================== */

function renderHistory(){

historyContainer.innerHTML='';

historyData[currentMode]
.forEach(item=>{

const div=
document.createElement('div');

div.className=
'glass rounded-2xl p-4';

if(currentMode==='thai'){

div.innerHTML=`

<div class="flex justify-between">

<span class="text-emerald-400 text-xs">

${item.date}

</span>

<span class="text-yellow-400 text-xs">

ล่าง ${item.bottom}

</span>

</div>

<div class="text-2xl font-bold mt-2">

${item.main}

</div>

`;

}else{

const top=
item.main.slice(-2);

const bottom=
item.main.slice(0,2);

div.innerHTML=`

<div class="flex justify-between">

<span class="text-red-400 text-xs">

${item.date}

</span>

</div>

<div class="text-2xl font-bold mt-2">

${item.main}

</div>

<div class="text-xs text-slate-400 mt-2">

บน ${top} | ล่าง ${bottom}

</div>

`;

}

historyContainer.appendChild(div);

});

}

/* ======================
 HOT DIGITS
====================== */

function renderHotDigits(){

hotDigits.innerHTML='';

const freq={};

for(let i=0;i<=9;i++){

freq[i]=0;

}

historyData[currentMode]
.forEach(item=>{

item.main
.split('')
.forEach(n=>{

freq[n]++;

});

});

const sorted=
Object.entries(freq)
.sort((a,b)=>b[1]-a[1])
.slice(0,5);

sorted.forEach(item=>{

const div=
document.createElement('div');

div.className=
'glass rounded-xl p-3 text-center';

div.innerHTML=`

<div class="text-2xl font-bold text-orange-400">

${item[0]}

</div>

<div class="text-xs text-slate-400">

${item[1]} hits

</div>

`;

hotDigits.appendChild(div);

});

}

/* ======================
 BALL
====================== */

function renderBalls(
container,
number,
color
){

container.innerHTML='';

number.split('')
.forEach(n=>{

const div=
document.createElement('div');

div.className=
`ball ${color}`;

div.innerText=n;

container.appendChild(div);

});

}

/* ======================
 GENERATE
====================== */

function randomNumber(length){

let result='';

for(let i=0;i<length;i++){

result+=
Math.floor(Math.random()*10);

}

return result;

}

function generateAI(){

const length=
currentMode==='thai'
?6
:4;

const number=
randomNumber(length);

const three=
number.slice(-3);

const two=
number.slice(-2);

let bottom='';

if(currentMode==='thai'){

bottom=
randomNumber(2);

}else{

bottom=
number.slice(0,2);

}

renderBalls(
mainContainer,
number,
'bg-gradient-to-br from-emerald-500 to-teal-700'
);

renderBalls(
threeContainer,
three,
'bg-gradient-to-br from-violet-500 to-indigo-700'
);

renderBalls(
twoContainer,
two,
'bg-gradient-to-br from-cyan-500 to-blue-700'
);

renderBalls(
bottomContainer,
bottom,
'bg-gradient-to-br from-yellow-500 to-orange-600'
);

}

/* ======================
 MODE
====================== */

thaiBtn.onclick=()=>{

currentMode='thai';

thaiBtn.className=
'flex-1 bg-emerald-600 py-3 rounded-xl font-bold';

laoBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

renderHistory();

renderHotDigits();

};

laoBtn.onclick=()=>{

currentMode='lao';

laoBtn.className=
'flex-1 bg-red-600 py-3 rounded-xl font-bold';

thaiBtn.className=
'flex-1 bg-slate-800 py-3 rounded-xl font-bold';

renderHistory();

renderHotDigits();

};

/* ======================
 BUTTON
====================== */

generateBtn.onclick=
generateAI;

/* ======================
 START
====================== */

renderHistory();

renderHotDigits();

</script>

</body>

</html>
